[package]
name = "noise-player"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
hound = "3.5.1"
rand = "0.10.3"
rand_chacha = "0.10.0"
realfft = "3.5.0"
rumqttc = { version = "0.25.1", default-features = false }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "signal", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
