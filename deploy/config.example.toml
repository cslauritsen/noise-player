# /etc/noise-player/config.toml (optional)
# Every setting shown with a NOISE_PLAYER_* name can instead come from that
# environment variable, which overrides this file.
instance_id = "bedroom"             # NOISE_PLAYER_INSTANCE_ID; one instance per Pi / room; used in topics and entity ids
# name = "Bedroom Noise"            # NOISE_PLAYER_NAME; HA device name (default: "Noise Player <instance_id>")

[mqtt]
host = "192.168.1.4"                # NOISE_PLAYER_MQTT_HOST; in Docker, .local names may not resolve
port = 1883                         # NOISE_PLAYER_MQTT_PORT
username = "noise"                  # NOISE_PLAYER_MQTT_USERNAME
# password = "..."                  # overridden by /run/secrets/mqtt_password, then NOISE_PLAYER_MQTT_PASSWORD
# discovery_prefix = "homeassistant"
# base_topic = "noise_player"

[audio]
# device = "USB"                    # NOISE_PLAYER_AUDIO_DEVICE; name or id from `noise-player devices`; default output if unset

[button]
# Momentary push button between a GPIO pin and ground (internal pull-up); toggles playback
# and updates the Home Assistant switch. Disabled unless gpio is set.
# gpio = 17                         # NOISE_PLAYER_BUTTON_GPIO; BCM number (17 = physical pin 11; ground is pin 9)
# chip = "/dev/gpiochip0"           # NOISE_PLAYER_BUTTON_CHIP
# debounce_ms = 50

[temperature]
# DS18B20 on the 1-Wire bus: needs `dtoverlay=w1-gpio,gpiopin=4` in /boot/firmware/config.txt
# and a 4.7k pull-up between DQ (data) and 3.3V. Wire VDD to 3.3V, GND to ground, DQ to GPIO 4.
# Shows up in Home Assistant as a "Temperature" sensor on this device.
# enabled = false                   # NOISE_PLAYER_TEMPERATURE_ENABLED
# interval_seconds = 30.0
# sensor = "28-0123456789ab"        # NOISE_PLAYER_TEMPERATURE_SENSOR; first one found if unset (see /sys/bus/w1/devices)

[noise]
# loop_seconds = 60.0
# highpass_hz = 20.0
# default_type = "brown"            # used until the broker delivers a retained value
# default_volume = 40
# sleep_fade_seconds = 30.0
